repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        # Pinned exactly (not >=) to match uv.lock: a newer transitive version here
        # can ship different stub signatures than what the app is actually built
        # against, producing mypy errors that don't reproduce with `uv run mypy`.
        additional_dependencies:
          - arq==0.25.0
          - fastapi==0.143.2
          - pydantic-settings==2.16.0
          - redis==7.4.1
          - structlog==26.1.0
          - uuid6==2025.0.1
          - limits==5.7.0
          - pytest==9.1.1
          - prometheus-fastapi-instrumentator==8.1.0
          - python-multipart==0.0.32
          - httpx==0.28.1
        args: [--strict, src/similarity, tests]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-added-large-files
